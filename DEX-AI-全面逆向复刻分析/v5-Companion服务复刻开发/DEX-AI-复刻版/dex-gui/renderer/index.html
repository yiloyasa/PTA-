<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEX AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 280px; background: #16213e; border-right: 1px solid #0f3460; padding: 16px; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .header { padding: 16px 24px; border-bottom: 1px solid #0f3460; }
    .chat { flex: 1; overflow-y: auto; padding: 24px; }
    .input-area { padding: 16px 24px; border-top: 1px solid #0f3460; }
    .input-area textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0f3460; background: #16213e; color: #eee; resize: none; min-height: 60px; }
    .sidebar-title { color: #e94560; font-size: 14px; font-weight: bold; margin-bottom: 16px; }
    .thread-list { list-style: none; }
    .thread-item { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
    .thread-item:hover { background: #0f3460; }
    .status-bar { padding: 8px 16px; background: #0f3460; font-size: 12px; }
    .message { margin-bottom: 16px; display: flex; }
    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }
    .message-bubble { max-width: 70%; padding: 12px 16px; border-radius: 12px; }
    .message.user .message-bubble { background: #e94560; }
    .message.assistant .message-bubble { background: #16213e; border: 1px solid #0f3460; }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-title">DEX AI</div>
      <ul class="thread-list" id="threadList">
        <li class="thread-item">+ 新对话</li>
      </ul>
      <div style="margin-top: 24px;">
        <div class="sidebar-title">手机设备</div>
        <div id="deviceList" style="font-size: 13px; color: #888;"></div>
      </div>
    </div>
    <div class="main">
      <div class="header">
        <span id="statusText">就绪</span>
        <span style="float: right; font-size: 12px; color: #888;" id="deviceInfo"></span>
      </div>
      <div class="chat" id="chatMessages"></div>
      <div class="input-area">
        <textarea id="messageInput" placeholder="输入消息..." rows="2"></textarea>
      </div>
      <div class="status-bar" id="companionStatus">Companion: 启动中...</div>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');

    // 显示设备信息
    ipcRenderer.invoke('get-device-info').then(info => {
      document.getElementById('deviceInfo').textContent = `${info.platform} | v${info.version}`;
    });

    // 监听 Companion 日志
    ipcRenderer.on('companion-log', (event, log) => {
      document.getElementById('companionStatus').textContent = `Companion: ${log}`;
    });

    // 发送消息
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (text) {
          addMessage('user', text);
          input.value = '';
          // 模拟回复
          setTimeout(() => addMessage('assistant', '收到您的消息。AI 功能正在开发中...'), 500);
        }
      }
    });

    function addMessage(role, text) {
      const chat = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `<div class="message-bubble">${text}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
